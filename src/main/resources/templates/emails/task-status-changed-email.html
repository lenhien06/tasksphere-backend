<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task đã đổi trạng thái</title>
</head>
<body style="margin:0; padding:0; background-color:#f3f4f6; font-family:'Segoe UI', Arial, Helvetica, sans-serif; color:#111827;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f3f4f6; margin:0; padding:32px 16px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:640px; background-color:#ffffff; border:1px solid #e5e7eb; border-radius:18px; overflow:hidden;">
                <tr>
                    <td align="center" style="padding:32px 40px 24px;">
                        <img th:src="${logoUrl}" alt="TaskSphere" width="44" height="44" style="display:block; width:44px; height:44px; margin:0 auto 14px;" />
                        <div style="font-size:30px; font-weight:700; color:#111827; letter-spacing:0.4px;" th:text="${appName}">TaskSphere</div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:0 40px;">
                        <div style="height:1px; background-color:#e5e7eb;"></div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:36px 40px 40px;">
                        <div style="text-align:center; margin-bottom:28px;">
                            <div style="display:inline-block; padding:8px 14px; border-radius:999px; background-color:#ecfdf5; color:#047857; font-size:12px; font-weight:600;">
                                Cập nhật tiến độ task
                            </div>
                        </div>
                        <h1 style="margin:0 0 18px; text-align:center; font-size:30px; line-height:1.3; color:#111827; font-weight:700;">
                            Xin chào <span th:text="${recipientName}">Bạn</span>
                        </h1>
                        <p style="margin:0 0 16px; font-size:16px; line-height:1.7; color:#374151;">
                            <strong th:text="${actorName}">Một thành viên</strong> vừa cập nhật trạng thái task trong dự án
                            <strong th:text="${projectName}">Project</strong>.
                        </p>
                        <div style="margin:28px 0; padding:20px; border:1px solid #e5e7eb; border-radius:14px; background-color:#f9fafb;">
                            <p style="margin:0 0 10px; font-size:14px; color:#6b7280;">Task</p>
                            <p style="margin:0 0 6px; font-size:18px; font-weight:700; color:#111827;">
                                <span th:text="${taskCode}">TSK-001</span> - <span th:text="${taskTitle}">Task title</span>
                            </p>
                            <p style="margin:0 0 14px; font-size:15px; line-height:1.6; color:#374151;">
                                Trạng thái đã đổi từ <strong th:text="${oldStatus}">TODO</strong> sang
                                <strong th:text="${newStatus}">IN_PROGRESS</strong>.
                            </p>
                            <p th:if="${dueDate != null}" style="margin:0; font-size:16px; color:#111827;">
                                Hạn xử lý: <strong th:text="${dueDate}">01/01/2026</strong>
                            </p>
                        </div>
                        <div style="text-align:center; margin-top:32px;">
                            <a th:href="${taskUrl}"
                               style="display:inline-block; padding:14px 28px; background-color:#111827; color:#ffffff; text-decoration:none; border-radius:12px; font-size:15px; font-weight:600;">
                                Xem chi tiết task
                            </a>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:0 40px 24px;">
                        <div style="height:1px; background-color:#e5e7eb;"></div>
                    </td>
                </tr>
                <tr>
                    <td align="center" style="padding:0 40px 32px; font-size:13px; line-height:1.7; color:#6b7280;">
                        Email được gửi tự động từ <span th:text="${appName}">TaskSphere</span>.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
